name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests --select F,E9 --output-format=github
      - name: Unit and integration tests
        run: pytest tests/unit tests/integration -q --timeout=120
      - name: Build package
        run: |
          python -m pip install build
          python -m build --wheel

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Audit installed packages
        run: pip-audit --desc

  e2e-qemu:
    name: Real QEMU boot (Ubuntu, TCG)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      OPENQVM_TEST_ISO: ${{ github.workspace }}/alpine-virt.iso
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
      - name: Download Alpine test ISO
        run: |
          curl -L --fail --retry 2 -o "$OPENQVM_TEST_ISO" \
            https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/alpine-virt-3.24.2-x86_64.iso
      - name: Install OpenQVM
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Show backend diagnostics
        run: openqvm-cli doctor --probe
      - name: End-to-end boot test
        run: pytest tests/end_to_end -m e2e -q -s --timeout=360
